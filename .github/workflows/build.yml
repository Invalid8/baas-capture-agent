name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller==6.11.1 pystray==0.19.5 pillow==11.0.0
      - name: Windows Biometric Framework answers (no reader on the runner)
        continue-on-error: true
        run: python -c "from baas_capture_agent.winbio import WinBioReader; print(WinBioReader().status())"
      - name: baas-probe.exe
        run: pyinstaller --onefile --console --uac-admin --name baas-probe --paths . packaging/windows/probe.py
      - name: baas-capture-agent.exe
        run: pyinstaller --onefile --noconsole --uac-admin --name baas-capture-agent --paths . --hidden-import pystray._win32 packaging/windows/agent.py
      - name: Setup .exe
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = python -c "import baas_capture_agent; print(baas_capture_agent.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\setup.iss
      - name: Install the setup, check the agent runs as LocalSystem, install over it, uninstall
        timeout-minutes: 10
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\baas-capture-agent-setup-*.exe | Select-Object -First 1).FullName
          $quiet = "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          function Run-Quiet($exe) { (Start-Process $exe -ArgumentList $quiet -PassThru).WaitForExit() }
          Run-Quiet $setup
          $status = Invoke-RestMethod http://127.0.0.1:7501/status
          $status | ConvertTo-Json -Compress
          $version = python -c "import baas_capture_agent; print(baas_capture_agent.__version__)"
          if ($status.version -ne $version) { throw "agent answers as $($status.version), expected $version" }
          $task = Get-ScheduledTask -TaskName "BAAS Capture Agent"
          if ($task.Principal.UserId -ne "SYSTEM") { throw "the agent task does not run as LocalSystem" }
          if ($task.Settings.DisallowStartIfOnBatteries -or $task.Settings.StopIfGoingOnBatteries) { throw "the agent task stops on battery" }
          if ($task.Settings.ExecutionTimeLimit -ne "PT0S") { throw "the agent task has a time limit: $($task.Settings.ExecutionTimeLimit)" }
          $owners = Get-CimInstance Win32_Process -Filter "Name='baas-capture-agent.exe'" | ForEach-Object { (Invoke-CimMethod -InputObject $_ -MethodName GetOwner).User }
          "agent processes run as: $($owners -join ', ')"
          if ("SYSTEM" -notin $owners) { throw "no agent process runs as LocalSystem" }
          Get-ScheduledTask -TaskName "BAAS Capture Agent icon" | Out-Null
          Run-Quiet $setup
          Invoke-RestMethod http://127.0.0.1:7501/status | Out-Null
          Run-Quiet "${env:ProgramFiles}\BAAS Capture Agent\unins000.exe"
          for ($i = 0; $i -lt 60; $i++) {
            $left = (Get-ScheduledTask -TaskName "BAAS Capture Agent*" -ErrorAction SilentlyContinue) -or (Get-Process baas-capture-agent -ErrorAction SilentlyContinue)
            if (-not $left) { break }
            Start-Sleep -Seconds 1
          }
          if ($left) { throw "the agent's task or process is still there a minute after uninstall" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  deb:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          { sed -n '3,5p' CHANGELOG.md; echo; awk -v h="## $v " 'index($0,h)==1{on=1;next} /^## /{on=0} on' CHANGELOG.md; } > notes.md
          grep -q '^- ' notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
      - name: One file each, under the names the console's download buttons use
        run: |
          mv out/windows/baas-capture-agent-setup-*.exe out/baas-capture-agent-setup.exe
          mv out/deb/baas-capture-agent_*_all.deb out/baas-capture-agent.deb
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" out/baas-capture-agent-setup.exe out/baas-capture-agent.deb out/windows/baas-probe.exe --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file notes.md

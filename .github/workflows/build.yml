name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller==6.11.1 pystray==0.19.5 pillow==11.0.0
      - name: Windows Biometric Framework answers (no reader on the runner)
        continue-on-error: true
        run: python -c "from baas_capture_agent.winbio import WinBioReader; print(WinBioReader().status())"
      - name: baas-probe.exe
        run: pyinstaller --onefile --console --uac-admin --name baas-probe --paths . packaging/windows/probe.py
      - name: baas-capture-agent.exe
        run: pyinstaller --onefile --noconsole --uac-admin --name baas-capture-agent --paths . --hidden-import pystray._win32 packaging/windows/agent.py
      - name: Setup .exe
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = python -c "import baas_capture_agent; print(baas_capture_agent.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  deb:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" out/windows/*.exe out/deb/*.deb --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes "Capture agent ${GITHUB_REF_NAME}"

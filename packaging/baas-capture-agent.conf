# Fingerprint capture agent. Restart after editing:
#   systemctl --user restart baas-capture-agent
BAAS_AGENT_PORT=7501
# Nothing to set for most PCs: a new site asks "Allow ... to use the fingerprint
# reader?" once on screen, and you can manage sites at http://127.0.0.1:7501.
# Sites listed here (comma-separated) are allowed without asking.
BAAS_AGENT_ORIGINS=
# Seconds to wait for a finger before giving up.
BAAS_AGENT_TIMEOUT=30

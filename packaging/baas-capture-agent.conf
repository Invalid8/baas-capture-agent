# BAAS capture agent. Restart after editing:
#   systemctl --user restart baas-capture-agent
BAAS_AGENT_PORT=7501
# Kiosk origins allowed to call the agent (comma-separated). http://localhost
# and http://127.0.0.1 on any port are always allowed for development.
BAAS_AGENT_ORIGINS=https://baas-app-kappa.vercel.app
# Seconds to wait for a finger before giving up.
BAAS_AGENT_TIMEOUT=30
